# ============================================================
#  SMARTERP · Stack Supabase Self-Hosted (Production-grade local)
#  Politica anti-blackout: restart:always + named volumes + healthcheck
# ============================================================

services:

  # ----------------------------------------------------------
  #  PostgreSQL 15 (Supabase) — cuore dati. Persistenza blindata.
  # ----------------------------------------------------------
  supabase-db:
    image: supabase/postgres:15.8.1.060
    container_name: smarterp-db
    restart: always                       # <-- resilienza ai riavvii/blackout
    ports:
      - "5432:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      # 1) Dati permanenti su HDD host (NON si perdono allo spegnimento)
      - smarterp_db_data:/var/lib/postgresql/data
      # 2) Script di init eseguito SOLO al primo boot (DB vuoto)
      - ./volumes/db/init/00_init_smarterp.sql:/docker-entrypoint-initdb.d/00_init_smarterp.sql:ro
    healthcheck:
      # Il DB è "healthy" SOLO quando pg_isready risponde realmente
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - smarterp-net

  # ----------------------------------------------------------
  #  GoTrue — Autenticazione
  # ----------------------------------------------------------
  supabase-auth:
    image: supabase/gotrue:v2.177.0
    container_name: smarterp-auth
    restart: always
    depends_on:
      supabase-db:
        condition: service_healthy        # <-- parte SOLO a DB pronto
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
    networks:
      - smarterp-net

  # ----------------------------------------------------------
  #  PostgREST — API REST auto-generata su PostgreSQL
  # ----------------------------------------------------------
  supabase-rest:
    image: postgrest/postgrest:v12.2.12
    container_name: smarterp-rest
    restart: always
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    networks:
      - smarterp-net

  # ----------------------------------------------------------
  #  Realtime — WebSocket (chat live, sync inventario)
  # ----------------------------------------------------------
  supabase-realtime:
    image: supabase/realtime:v2.34.47
    container_name: smarterp-realtime
    restart: always
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    networks:
      - smarterp-net

  # ----------------------------------------------------------
  #  Storage — file/allegati (foto prodotti, PDF fatture)
  # ----------------------------------------------------------
  supabase-storage:
    image: supabase/storage-api:v1.19.3
    container_name: smarterp-storage
    restart: always
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: smarterp
      REGION: local
      GLOBAL_S3_BUCKET: smarterp
    volumes:
      # Persistenza permanente dei file su HDD host
      - smarterp_storage_data:/var/lib/storage
    networks:
      - smarterp-net

  # ----------------------------------------------------------
  #  Kong — API Gateway unico su :8000 (richiesto dall'SDK Flutter)
  # ----------------------------------------------------------
  supabase-kong:
    image: kong:2.8.1
    container_name: smarterp-kong
    restart: always
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-storage:
        condition: service_started
      supabase-realtime:
        condition: service_started
    ports:
      - "8000:8000/tcp"      # <-- endpoint pubblico unificato per Flutter
      - "8443:8443/tcp"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./volumes/api/kong.yml:/home/kong/kong.yml:ro
    networks:
      - smarterp-net

  # ----------------------------------------------------------
  #  Adminer — amministrazione DB via web su :8080
  # ----------------------------------------------------------
  adminer:
    image: adminer:4.8.1
    container_name: smarterp-adminer
    restart: always
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: supabase-db
      ADMINER_DESIGN: dracula
    networks:
      - smarterp-net

# ============================================================
#  NAMED VOLUMES — persistenza fisica permanente su disco host.
#  Sopravvivono a `docker compose down`, riavvii e aggiornamenti
#  delle immagini. Si cancellano SOLO con `docker compose down -v`.
# ============================================================
volumes:
  smarterp_db_data:
    driver: local
  smarterp_storage_data:
    driver: local

networks:
  smarterp-net:
    driver: bridge
